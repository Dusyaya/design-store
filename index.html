<!doctype html>
<html lang="ru" data-root="./">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f4f1">
  <meta name="description" content="Портфолио графического дизайнера.">
  <title>Портфолио — Дарья Атрохина</title>
  <link rel="stylesheet" href="./light.css?v=20261119-home-copy">
</head>
<body class="home-page">
  <header class="topbar">
    <a class="brand" href="./">ATROKHINA</a>
    <nav></nav>
  </header>
  <main id="app">
    <section class="portfolio-hero wrap">
      <div class="portfolio-heading"><h1>ПОРТФОЛИО</h1><span class="portfolio-year">2026</span></div>
      <div class="portfolio-composition">
        <div class="portfolio-intro">
          <h2>Привет, я Даша!</h2>
          <p>Создаю визуальные концепции для брендов: от рекламы и полиграфии до мерча и интерфейсов. Люблю типографику и выразительные композиции.</p>
          <h2 class="portfolio-skills-heading"></h2>
          <ul class="portfolio-skills"></ul>
        </div>
        <figure class="portrait-window">
          <figcaption class="window-bar"><span class="window-lights" aria-hidden="true"><i></i><i></i><i></i></span><span class="portrait-filename"></span></figcaption>
          <picture>
            <source media="(max-width: 950px)" srcset="assets/portrait-clean-mobile.jpg">
            <img src="assets/IMG_4855-clean.jpg" width="1125" height="1500" fetchpriority="high" alt="Дарья Атрохина">
          </picture>
        </figure>
        <div class="skill-orbit" role="group" aria-describedby="skill-controls-help">
          <span class="sr-only" id="skill-controls-help"></span>
          <button class="skill-badge skill-ps" type="button"><span class="skill-badge-visual"><span class="skill-tile">Ps</span><span>Photoshop</span></span></button>
          <button class="skill-badge skill-ai" type="button"><span class="skill-badge-visual"><span class="skill-tile">Ai</span><span>Illustrator</span></span></button>
          <button class="skill-badge skill-figma" type="button"><span class="skill-badge-visual"><span class="skill-tile"><img src="assets/icons/figma.svg" alt="" width="38" height="38"></span><span>Figma</span></span></button>
          <button class="skill-badge skill-blender" type="button"><span class="skill-badge-visual"><span class="skill-tile"><img src="assets/blender_logo.png" alt="" width="48" height="48"></span><span>Blender</span></span></button>
          <button class="skill-badge skill-js" type="button"><span class="skill-badge-visual"><span class="skill-tile">Js</span><span>JavaScript</span></span></button>
          <button class="skill-badge skill-neural" type="button"><span class="skill-badge-visual"><span class="skill-tile">AI</span><span class="skill-neural-label"></span></span></button>
        </div>
      </div>
    </section>

    <section class="catalog-section wrap" id="catalog" aria-labelledby="catalog-heading">
      <div class="catalog-layout">
        <div class="catalog-intro">
          <h2 id="catalog-heading"></h2>
          <p class="catalog-count" role="status"></p>
          <div class="filters" id="filters" role="group"></div>
        </div>
        <div class="catalog-grid" id="shelf"></div>
      </div>
    </section>

    <section class="about wrap" id="about">
      <div class="section-head"></div>
      <div class="about-layout">
        <div class="about-copy">
          <h2></h2>
          <div class="about-text"></div>
          <div class="about-actions">
            <div class="contact-links"></div>
            <a class="next" href="https://t.me/atrokhina_darya" target="_blank" rel="noopener noreferrer">Обсудить проект ↗</a>
          </div>
        </div>
        <figure class="about-portrait floating-window">
          <figcaption class="window-bar"><span class="window-lights" aria-hidden="true"><i></i><i></i><i></i></span><span class="about-portrait-filename"></span></figcaption>
          <img src="assets/about-portrait-520.webp"
            srcset="assets/about-portrait-520.webp 520w, assets/about-portrait-1040.webp 1040w"
            sizes="(max-width: 820px) min(88vw, 420px), (max-width: 1920px) 21vw, 430px"
            width="520" height="693" alt="Дарья Атрохина" loading="lazy" decoding="async">
        </figure>
      </div>
    </section>
  </main>
  <footer></footer>
  <script src="./content.js?v=20261119-source-copy"></script>
  <script src="./projects.js?v=20261119-source-copy"></script>
  <script src="./translations.js?v=20261119-source-copy"></script>
  <script src="./shared.js?v=20261119-ru-tags"></script>
  <script src="./home.js?v=20261119-copy-system"></script>
</body>
</html>
